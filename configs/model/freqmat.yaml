hidden_size: 256
inner_size: 1024
n_layers: 2
ffn_type: moe        # moe (default, replaces the FFN) | dense (for ablation)
moe_experts: 8
moe_topk: 2
moe_inner: null      # null -> inner_size // moe_experts (param-matched with dense FFN)
moe_aux_weight: 0.01 # load-balancing loss weight
n_heads: 2
hidden_dropout_prob: 0.3
attn_dropout_prob: 0.1
layer_norm_eps: 1.0e-12
mamba_type: mamba3   # mamba3 (official Triton kernels) | mamba1 (pure-PyTorch scan, no extra deps)
d_state: 32
headdim: 32          # mamba3 only (hidden*expand must be divisible)
chunk_size: 64       # mamba3 only
d_conv: 4
expand: 2
attn_window: 0      # 0 = full causal; >0 = local sliding window
# ablation switches
use_freq: true
freq_type: osc       # learned (FMLP) | bsa (BSARec rescaler) | both | gft (time-weighted graph Fourier) | osc (causal damped oscillator)
freq_position: pre   # pre (sequential) | branch (parallel branch, fused by the gate -> 3-way gate)
freq_cutoff: 5       # c lowest frequencies kept (bsa/both/gft)
gft_gamma: 0.5       # gft: edge weight (1+gap_days)^-gamma
use_mamba: true
use_attn: true
osc_hf: true         # osc: add the beta^2 (x - LP(x)) high-frequency term
osc_beta_init: 0.5   # osc: initial beta^2 (1.0 would give zero gradient to m, c, k)
use_local: true      # extra causal conv + GRU branch
local_kernel: 4
mamba_flip: true     # extra Mamba on the partially flipped sequence
flip_keep_last: 5
flip_share_weights: false
gate_granularity: branch  # channel | branch (scalar gate per branch: far fewer params with 4+ branches)
moe_shared: true     # always-on shared expert + routed experts
moe_shared_inner: null     # null -> inner_size // 2
moe_warmup_steps: 1000 # linear ramp of the routed part (training steps); 0 = off
norm_position: pre   # pre | post: x + f(norm(x)) with a final norm, or norm(x + f(x))
norm_type: rmsnorm   # rmsnorm | layernorm
ffn_act: swiglu      # swiglu | gelu (swiglu uses 2/3 of the width: same parameter count)
head_mlp: true       # residual MLP on the final state before scoring against the item embeddings
pos_embedding: true # learned absolute position embedding (SASRec-style)
extrap: true         # one-step causal extrapolation of the final state
deep_sup_weight: 0.1 # weight of auxiliary CE on intermediate layers
loss_scope: last # last | all (all needs mamba_flip: false and freq_type none/osc: every branch causal)
pop_debias: true # query minus learned lambda * popularity centroid (lambda = 0 at init)
pop_align_weight: 0.05 # head-vs-tail item embedding alignment inside a sequence (0 = off)
pop_head_frac: 0.2 # share of items counted as head
