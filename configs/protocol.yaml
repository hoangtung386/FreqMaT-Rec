# Shared protocol: global temporal split 80:10:10, FULL-ranking (no sampled metrics)
data_path: data
load_col:
  inter: [user_id, item_id, rating, timestamp]
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"
MAX_ITEM_LIST_LENGTH: 50
benchmark_filename: null
eval_args:
  # all interactions sorted by time: the first 80% train, the next 10% validation, the last 10% test.
  # Every sample's history is older than its target, and no training target is newer than a validation target.
  split: {RS: [0.8, 0.1, 0.1]}
  group_by: none
  order: TO
  mode: full
repeatable: true
metrics: [Hit, NDCG, Recall]
topk: [5, 10]
valid_metric: NDCG@10
train_batch_size: 256
eval_batch_size: 256
epochs: 100
stopping_step: 10
learning_rate: 0.001
weight_decay: 0.0
seed: 2024
reproducibility: true
loss_type: CE
train_neg_sample_args: null
checkpoint_dir: saved
